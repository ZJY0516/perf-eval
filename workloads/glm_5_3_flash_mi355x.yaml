name: glm_5_3_flash-mi355x
gpu: MI355X
num_gpus: 8
nightly: true

vllm:
  model: zai-org/GLM-5.3-Flash
  env:
    VLLM_ROCM_USE_AITER: 1
  serve_args: >-
    --tensor-parallel-size 8
    --tool-call-parser glm47
    --reasoning-parser glm45
    --enable-auto-tool-choice

lm_eval:
  model_args:
    tokenized_requests: false
    tokenizer_backend: null
    timeout: 6000
  tasks:
    - name: gsm8k
      num_fewshot: 5
      model_args:
        num_concurrent: 64
        max_length: 40960
        max_gen_toks: 65536

bfcl:
  test_categories:
    - simple_python
    - multiple
    - parallel
    - parallel_multiple
    - multi_turn
  num_threads: 8

vllm_bench:
  metadata:
    # The native-FP8 checkpoint has no precision marker in its repo name.
    precision: fp8
  configs:
    - name: 8k-in-1k-out
      backend: openai
      dataset: random
      input_len: 8192
      output_len: 1024
      num_prompts: 512
      max_concurrency: 128
