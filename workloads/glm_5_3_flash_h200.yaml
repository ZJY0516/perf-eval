name: glm_5_3_flash-h200
gpu: H200
num_gpus: 8
nightly: true

vllm:
  model: zai-org/GLM-5.3-Flash
  serve_args: >-
    --tensor-parallel-size 8
    --speculative-config.method mtp
    --speculative-config.num_speculative_tokens 5
    --tool-call-parser glm47
    --reasoning-parser glm45
    --enable-auto-tool-choice

lm_eval:
  model_args:
    tokenized_requests: false
    tokenizer_backend: null
    timeout: 6000
  tasks:
    - name: gsm8k
      num_fewshot: 5
      model_args:
        num_concurrent: 64
        max_length: 40960
        max_gen_toks: 65536

vllm_bench:
  metadata:
    # The native-FP8 checkpoint has no precision marker in its repo name.
    precision: fp8
  configs:
    - name: 8k-in-1k-out
      backend: openai
      dataset: random
      input_len: 8192
      output_len: 1024
      num_prompts: 512
      max_concurrency: 128
      repetitions: 3
      args:
        num_warmups: 128
