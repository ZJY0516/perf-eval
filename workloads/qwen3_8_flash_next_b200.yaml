name: qwen3_8_flash_next-b200
gpu: B200
num_gpus: 4
nightly: true

vllm:
  model: Qwen/Qwen3.8-Flash-Next-FP8
  serve_args: >-
    --tensor-parallel-size 4
    --enable-expert-parallel
    --speculative-config.method mtp
    --speculative-config.num_speculative_tokens 2
    --reasoning-parser qwen3
    --trust-remote-code
    --max-num-seqs 256
    --max-model-len auto

lm_eval:
  model_args:
    tokenized_requests: false
    tokenizer_backend: null
    timeout: 6000
  tasks:
    - name: gsm8k
      num_fewshot: 5
      model_args:
        num_concurrent: 64
        max_length: 40960
        max_gen_toks: 65536

vllm_bench:
  configs:
    - name: 8k-in-1k-out
      backend: openai
      dataset: random
      input_len: 8192
      output_len: 1024
      num_prompts: 256
      max_concurrency: 128
